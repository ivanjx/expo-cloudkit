name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate tagged source and pack once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must exactly match v${version}`);
          }
          NODE

      - name: Install locked dependencies and validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Build through npm pack lifecycle
        run: node .github/scripts/pack-release.mjs "$RUNNER_TEMP/release-package"

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error

  native:
    name: Validate the release tarball in a clean native consumer
    needs: package
    uses: ./.github/workflows/transport.yml
    with:
      package-artifact: release-package

  release:
    name: Publish validated bytes to GitHub Release
    needs: [package, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'

      - name: Verify transferred bytes and release identity
        id: package
        working-directory: ${{ runner.temp }}/release-package
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const { filename, version, tag, sourceCommit, sha256 } = manifest;
          if (typeof filename !== 'string' || !/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.tgz$/.test(filename)) throw new Error('Unsafe tarball filename');
          if (process.env.GITHUB_REF_TYPE !== 'tag' || tag !== process.env.GITHUB_REF_NAME || tag !== `v${version}` || sourceCommit !== process.env.GITHUB_SHA) throw new Error('Release identity mismatch');
          const actual = crypto.createHash('sha256').update(fs.readFileSync(filename)).digest('hex');
          if (actual !== sha256 || fs.readFileSync(`${filename}.sha256`, 'utf8').trim() !== `${actual}  ${filename}`) throw new Error('Release checksum mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\ntag=${tag}\nprerelease=${version.includes('-')}\n`);
          NODE

      - name: Create immutable release with explicit assets
        working-directory: ${{ runner.temp }}/release-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_FILENAME: ${{ steps.package.outputs.filename }}
          RELEASE_PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          args=()
          if [ "$RELEASE_PRERELEASE" = true ]; then args+=(--prerelease); fi
          # Creation fails if this release already exists; never replace published assets.
          gh release create "$RELEASE_TAG" \
            "$RELEASE_FILENAME" "$RELEASE_FILENAME.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${args[@]}"
